<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TürkTube</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0f0f0f;
    color: white;
}

/* ÜST BAR */
header {
    height: 70px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 25px;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #ff0000;
}

.search {
    flex: 1;
    display: flex;
    max-width: 650px;
    margin: auto;
}

.search input {
    width: 100%;
    height: 42px;
    background: #121212;
    border: 1px solid #333;
    color: white;
    padding: 0 15px;
    font-size: 16px;
    border-radius: 22px 0 0 22px;
    outline: none;
}

.search button {
    width: 60px;
    border: none;
    background: #303030;
    color: white;
    font-size: 18px;
    border-radius: 0 22px 22px 0;
    cursor: pointer;
}

.search button:hover {
    background: #444;
}

.upload-button {
    background: #ff0000;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 22px;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
}

.upload-button:hover {
    background: #cc0000;
}

/* ANA ALAN */
.container {
    display: flex;
}

/* SOL MENÜ */
.sidebar {
    width: 220px;
    min-height: calc(100vh - 70px);
    background: #181818;
    padding: 20px 10px;
    position: fixed;
    top: 70px;
    left: 0;
}

.sidebar button {
    width: 100%;
    background: transparent;
    border: none;
    color: white;
    text-align: left;
    padding: 14px 15px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.sidebar button:hover {
    background: #303030;
}

/* İÇERİK */
.content {
    margin-left: 220px;
    width: calc(100% - 220px);
    padding: 25px;
}

.title {
    font-size: 25px;
    margin-bottom: 25px;
}

/* VİDEOLAR */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.video-card {
    background: #181818;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
    cursor: pointer;
}

.video-card:hover {
    transform: translateY(-3px);
    background: #222;
}

.thumbnail {
    width: 100%;
    height: 170px;
    background: #272727;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.thumbnail video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-icon {
    font-size: 50px;
    color: #fff;
}

.video-info {
    padding: 15px;
}

.video-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 9px;
}

.channel {
    color: #aaa;
    font-size: 14px;
}

.views {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

/* YÜKLEME PENCERESİ */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.modal-box {
    width: 90%;
    max-width: 500px;
    background: #202020;
    padding: 30px;
    border-radius: 15px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.modal-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    background: #121212;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
}

.modal-box input[type="file"] {
    padding: 10px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.add-video {
    background: #ff0000;
    color: white;
}

.close {
    background: #444;
    color: white;
}

/* MOBİL */
@media (max-width: 800px) {

    header {
        padding: 0 12px;
        gap: 10px;
    }

    .logo {
        font-size: 18px;
    }

    .upload-button {
        padding: 9px 12px;
        font-size: 12px;
    }

    .sidebar {
        display: none;
    }

    .content {
        margin-left: 0;
        width: 100%;
        padding: 15px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }

    .thumbnail {
        height: 210px;
    }
}
</style>
</head>

<body>

<!-- ÜST MENÜ -->
<header>

    <div class="logo">
        <span>▶</span> TürkTube
    </div>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Video ara..."
            onkeyup="searchVideos()"
        >

        <button onclick="searchVideos()">🔍</button>
    </div>

    <button class="upload-button" onclick="openUpload()">
        ⬆ Video Yükle
    </button>

</header>


<div class="container">

    <!-- SOL MENÜ -->
    <aside class="sidebar">

        <button onclick="showHome()">🏠 Ana Sayfa</button>

        <button onclick="showAllVideos()">🎬 Videolar</button>

        <button>🔥 Popüler</button>

        <button>🕘 Geçmiş</button>

        <button>👍 Beğenilenler</button>

    </aside>


    <!-- ANA İÇERİK -->
    <main class="content">

        <h1 class="title" id="pageTitle">
            🎬 Videolar
        </h1>

        <div class="video-grid" id="videoGrid">

            <!-- VİDEO 1 -->
            <div class="video-card"
                 data-title="Türk Tarihi"
                 onclick="playVideo('videos/video1.mp4')">

                <div class="thumbnail">
                    <div class="play-icon">▶</div>
                </div>

                <div class="video-info">

                    <div class="video-title">
                        Türk Tarihi
                    </div>

                    <div class="channel">
                        🇹🇷 TürkTube
                    </div>

                    <div class="views">
                        1.245 görüntülenme
                    </div>

                </div>

            </div>


            <!-- VİDEO 2 -->
            <div class="video-card"
                 data-title="Türkiye"
                 onclick="playVideo('videos/video2.mp4')">

                <div class="thumbnail">
                    <div class="play-icon">▶</div>
                </div>

                <div class="video-info">

                    <div class="video-title">
                        Türkiye
                    </div>

                    <div class="channel">
                        🇹🇷 TürkTube
                    </div>

                    <div class="views">
                        853 görüntülenme
                    </div>

                </div>

            </div>


            <!-- VİDEO 3 -->
            <div class="video-card"
                 data-title="Atatürk"
                 onclick="playVideo('videos/video3.mp4')">

                <div class="thumbnail">
                    <div class="play-icon">▶</div>
                </div>

                <div class="video-info">

                    <div class="video-title">
                        Mustafa Kemal Atatürk
                    </div>

                    <div class="channel">
                        🇹🇷 TürkTube
                    </div>

                    <div class="views">
                        2.431 görüntülenme
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- VİDEO YÜKLEME PENCERESİ -->
<div class="modal" id="uploadModal">

    <div class="modal-box">

        <h2>📹 Video Yükle</h2>

        <input
            type="text"
            id="videoName"
            placeholder="Video başlığı"
        >

        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <div class="modal-buttons">

            <button
                class="add-video"
                onclick="uploadVideo()">
                Videoyu Ekle
            </button>

            <button
                class="close"
                onclick="closeUpload()">
                İptal
            </button>

        </div>

    </div>

</div>


<!-- VİDEO OYNATICI -->
<div class="modal" id="playerModal">

    <div class="modal-box">

        <video
            id="videoPlayer"
            controls
            style="width:100%; border-radius:10px;">
        </video>

        <br>

        <button
            class="close"
            style="width:100%; padding:12px;"
            onclick="closePlayer()">
            Kapat
        </button>

    </div>

</div>


<script>

/* YÜKLEME PENCERESİ */

function openUpload() {
    document.getElementById("uploadModal").style.display = "flex";
}

function closeUpload() {
    document.getElementById("uploadModal").style.display = "none";
}


/* VİDEO EKLE */

function uploadVideo() {

    const title = document.getElementById("videoName").value;
    const file = document.getElementById("videoFile").files[0];

    if (!title || !file) {
        alert("Lütfen video başlığı ve video seç!");
        return;
    }

    const videoURL = URL.createObjectURL(file);

    const card = document.createElement("div");

    card.className = "video-card";

    card.setAttribute("data-title", title);

    card.onclick = function() {
        playVideo(videoURL);
    };

    card.innerHTML = `

        <div class="thumbnail">

            <video
                src="${videoURL}"
                muted>
            </video>

        </div>

        <div class="video-info">

            <div class="video-title">
                ${title}
            </div>

            <div class="channel">
                👤 Sen
            </div>

            <div class="views">
                Yeni video
            </div>

        </div>

    `;

    document.getElementById("videoGrid").prepend(card);

    document.getElementById("videoName").value = "";
    document.getElementById("videoFile").value = "";

    closeUpload();

    alert("Video bu tarayıcıda eklendi!");

}


/* VİDEO OYNAT */

function playVideo(url) {

    const player = document.getElementById("videoPlayer");

    player.src = url;

    document.getElementById("playerModal").style.display = "flex";

    player.play();

}


function closePlayer() {

    const player = document.getElementById("videoPlayer");

    player.pause();

    player.src = "";

    document.getElementById("playerModal").style.display = "none";

}


/* ARAMA */

function searchVideos() {

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const cards =
        document.querySelectorAll(".video-card");

    cards.forEach(card => {

        const title =
            card
            .getAttribute("data-title")
            .toLowerCase();

        if (title.includes(search)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }

    });

}


/* ANA SAYFA */

function showHome() {

    document.getElementById("pageTitle").innerText =
        "🏠 Ana Sayfa";

    document.querySelectorAll(".video-card")
        .forEach(card => {
            card.style.display = "block";
        });

}


/* TÜM VİDEOLAR */

function showAllVideos() {

    document.getElementById("pageTitle").innerText =
        "🎬 Videolar";

    document.querySelectorAll(".video-card")
        .forEach(card => {
            card.style.display = "block";
        });

}

</script>

</body>
</html>
